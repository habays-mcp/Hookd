<!DOCTYPE html>
<html lang="en">
<head>

<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/favicon.png">

<title>hookd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Jost:wght@200;300&display=swap" rel="stylesheet">
<style>
/* VOICE: calm and clean like a native iPhone app — glass over soft colour, nothing loud
   IDEA: Apple's frosted-glass layers floating over a warm wash of her yarn colours
   PICTURE: her own granny squares and bag, drawn stitch by stitch, sitting on clear glass
   COLOUR and TYPE: warm ivory wash with mustard, sage and rose light behind frosted panes; amber-brown accent; San Francisco system type
   LAYOUT: phone first — large title, glass cards, floating glass tab bar; two columns from 900px */
:root{color-scheme:light dark;
 --bg:light-dark(#f6f1e9,#120f0d);
 --ink:light-dark(#1d1712,#f5efe8);--soft:light-dark(rgba(60,48,40,.62),rgba(245,239,232,.6));
 --glass:light-dark(rgba(255,255,255,.58),rgba(44,38,34,.52));--glass2:light-dark(rgba(255,255,255,.42),rgba(60,52,46,.42));
 --rim:light-dark(rgba(255,255,255,.75),rgba(255,255,255,.12));--hair:light-dark(rgba(60,40,20,.1),rgba(255,255,255,.09));
 --fill:light-dark(rgba(118,108,98,.12),rgba(255,255,255,.08));--fill2:light-dark(rgba(118,108,98,.2),rgba(255,255,255,.14));
 --acc:light-dark(#9a5b1e,#f0b25a);--accInk:light-dark(#fff,#2a1905);--accSoft:light-dark(rgba(201,138,27,.16),rgba(240,178,90,.18));
 --line:var(--hair);--choc:var(--acc);--chocInk:var(--accInk);--mus:light-dark(#d39a2a,#f0b25a);--musInk:#2a1905;--musBg:var(--accSoft);--sageBg:light-dark(rgba(125,150,118,.16),rgba(169,189,164,.14));
 --warn:light-dark(#c0392b,#ff8a7a);--ok:light-dark(#2f8a4a,#6fd58c);--card:var(--glass);
 --blur:saturate(180%) blur(24px);--shadow:0 1px 0 var(--rim) inset,0 10px 30px -12px rgba(40,25,10,.22),0 2px 6px -2px rgba(40,25,10,.08)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:80px;-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font:17px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,system-ui,sans-serif;letter-spacing:-.01em;overflow-x:clip;padding-bottom:calc(104px + env(safe-area-inset-bottom));background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;transition:background .4s;background:
 radial-gradient(38% 30% at 12% 10%,var(--b1,transparent),transparent 70%),
 radial-gradient(36% 32% at 92% 22%,var(--b2,transparent),transparent 70%),
 radial-gradient(40% 34% at 78% 88%,var(--b3,transparent),transparent 70%),
 radial-gradient(34% 30% at 8% 78%,var(--b4,transparent),transparent 70%),var(--bg)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.th-o{border:0;background:var(--fill);border-radius:18px;padding:10px 6px;display:grid;justify-items:center;gap:6px;font-weight:600;font-size:13px;color:var(--ink)}
.th-o i{width:52px;height:52px;border-radius:50%;display:block;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2),0 4px 10px -4px rgba(0,0,0,.3)}
.th-o[aria-pressed=true]{background:var(--glass);box-shadow:0 0 0 2px var(--acc),var(--shadow)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 60%,transparent);outline-offset:2px}
h1,h2,h3{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;font-weight:700;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.025em}
h1{font-size:clamp(32px,7vw,46px)}h2{font-size:24px;letter-spacing:-.02em}h3{font-size:19px;letter-spacing:-.015em}
p{margin:0}
.glass,.top,.tabs,.card,.hero,.tool,.proj,.sheet>div,.feature,.toast{-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.top{position:sticky;top:0;z-index:5;background:light-dark(rgba(250,246,240,.62),rgba(20,16,14,.55));padding:calc(10px + env(safe-area-inset-top)) max(4vw,16px) 10px;display:flex;align-items:center;gap:12px;border-bottom:.5px solid var(--hair)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;margin-right:auto;font-family:Jost,"SF Pro Display",-apple-system,sans-serif;font-size:30px;font-weight:200;letter-spacing:.02em;line-height:1}
.brand svg{width:32px;height:32px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.15))}
.nav{display:none;gap:2px;padding:4px;border-radius:999px;background:var(--fill)}
.nav a,.tabs a{text-decoration:none;color:var(--soft);font-weight:600}
.nav a{padding:8px 15px;border-radius:999px;font-size:15px}
.nav a[aria-current=page]{background:var(--glass);color:var(--ink);box-shadow:var(--shadow)}
.iconbtn{width:44px;height:44px;border-radius:50%;border:.5px solid var(--rim);background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);display:grid;place-items:center;box-shadow:var(--shadow);color:var(--ink)}
.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:6;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:light-dark(rgba(255,255,255,.62),rgba(40,34,30,.6));border:.5px solid var(--rim);border-radius:32px;padding:6px;box-shadow:0 1px 0 var(--rim) inset,0 16px 40px -12px rgba(30,18,8,.35)}
.tabs a{display:grid;justify-items:center;gap:1px;font-size:11px;padding:7px 0 6px;border-radius:26px;transition:background .2s}
.tabs svg{width:24px;height:24px}
.tabs a[aria-current=page]{color:var(--acc);background:var(--fill)}
@media(min-width:900px){.nav{display:flex}.tabs{display:none}body{padding-bottom:48px}}
.wrap{max-width:1180px;margin:0 auto;padding:22px max(4vw,16px) 40px}
.head{margin:4px 2px 20px}.head p{color:var(--soft);margin-top:8px;max-width:60ch;font-size:16px}
.card{background:var(--glass);border:.5px solid var(--rim);border-radius:26px;padding:20px;box-shadow:var(--shadow)}
.card+.card,.stack>*+*{margin-top:14px}
.cols{display:grid;gap:14px}
@media(min-width:900px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);align-items:start}.sticky{position:sticky;top:84px}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;border:0;background:var(--acc);color:var(--accInk);font-weight:600;font-size:16px;text-decoration:none;white-space:nowrap;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 6px 16px -8px color-mix(in srgb,var(--acc) 80%,transparent);transition:transform .15s,filter .15s}
.btn:active{transform:scale(.97)}
.btn.mus{background:linear-gradient(180deg,light-dark(#e2ab3c,#f4c06a),light-dark(#c98a1b,#e09f3c));color:#2a1905}
.btn.ghost{background:var(--fill);color:var(--ink);box-shadow:none;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.btn.big{min-height:52px;font-size:17px;padding:0 26px}
.btn.danger{background:light-dark(rgba(192,57,43,.1),rgba(255,138,122,.14));color:var(--warn);box-shadow:none}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 15px;border-radius:999px;border:0;background:var(--fill);font-weight:600;font-size:15px;color:var(--ink);transition:background .15s}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);box-shadow:0 4px 12px -6px rgba(0,0,0,.4)}
.chip:disabled{opacity:.35;cursor:default}
@media(pointer:coarse){.chip{min-height:44px}}
.lab{font-size:13px;font-weight:600;color:var(--soft);margin:18px 0 8px;text-transform:none}
.lab:first-child{margin-top:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fld{display:grid;gap:5px;font-size:13px;font-weight:600}
.fld>span{color:var(--soft);padding-left:4px}
.inp{display:flex;align-items:center;border-radius:14px;background:var(--fill);min-height:46px;padding:0 14px;transition:box-shadow .15s}
.inp:focus-within{box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 55%,transparent)}
.inp input,.inp select{border:0;background:transparent;outline:0;width:100%;font-size:17px;min-height:44px;font-weight:500;-webkit-appearance:none;appearance:none}
.inp em{font-style:normal;color:var(--soft);font-size:15px;padding-left:6px;white-space:nowrap}
textarea{width:100%;border:0;border-radius:14px;background:var(--fill);padding:12px 14px;font-size:17px;min-height:92px;resize:vertical;outline:0}
textarea:focus{box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 55%,transparent)}
input[type=range]{width:100%;accent-color:var(--acc);min-height:40px}
input[type=color]{width:46px;height:46px;border:0;padding:0;background:none;border-radius:50%;-webkit-appearance:none;appearance:none;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}input[type=color]::-webkit-color-swatch{border:2px solid var(--rim);border-radius:50%}
.note{font-size:14px;color:var(--soft)}
.warn{color:var(--warn);font-weight:600;font-size:14px}
.okc{color:var(--ok);font-weight:700}
.badc{color:var(--warn);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--glass2);border:.5px solid var(--rim);border-radius:18px;padding:12px 14px}
.stat b{display:block;font-size:clamp(24px,5.4vw,30px);line-height:1.1;font-weight:700;letter-spacing:-.03em;white-space:nowrap;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--soft);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;color:var(--soft);font-weight:600;padding:8px 6px;border-bottom:.5px solid var(--hair)}
td{padding:10px 6px;border-bottom:.5px solid var(--hair);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sw{display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:-3px;margin-right:8px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.25),0 1px 2px rgba(0,0,0,.15)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:16px}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--accSoft);color:var(--acc);display:grid;place-items:center;font-weight:700;font-size:15px}
.steps b{display:block;margin-bottom:2px;font-weight:650}
.rounds{display:grid;gap:8px}
.rnd{background:var(--glass2);border:.5px solid var(--rim);border-radius:18px;padding:12px 14px}
.rnd h4{margin:0 0 4px;font-size:15px;font-weight:650;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rnd .cnt{font-size:14px;color:var(--soft);font-weight:600;margin-top:4px}
details{border-radius:18px;padding:0 14px;background:var(--fill)}
details+details{margin-top:10px}
summary{min-height:48px;display:flex;align-items:center;font-weight:600;cursor:pointer}
details[open]{padding-bottom:14px}
.fig{background:radial-gradient(120% 90% at 30% 10%,light-dark(rgba(255,255,255,.7),rgba(255,255,255,.06)),transparent 60%),var(--fill);border-radius:22px;display:grid;place-items:center;padding:14px;border:.5px solid var(--rim)}
.fig svg{width:100%;height:auto;display:block;filter:drop-shadow(0 10px 18px rgba(40,25,10,.18))}
.sqfig svg{max-width:420px}
.palette{display:flex;flex-wrap:wrap;gap:14px}
.pal{display:grid;justify-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--soft)}
.pal input{box-shadow:0 4px 10px -4px rgba(0,0,0,.35)}
.dots{display:flex;flex-wrap:wrap;gap:8px}
.dot{width:40px;height:40px;border-radius:50%;border:0;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.25),0 2px 6px -2px rgba(0,0,0,.25);transition:transform .15s}
.dot[aria-pressed=true]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--acc);transform:scale(.92)}
.styles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.style{border:0;background:var(--fill);border-radius:20px;padding:10px 6px;display:grid;justify-items:center;gap:6px;font-weight:600;font-size:14px;color:var(--ink);transition:background .15s}
.style svg{width:62px;height:62px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15))}
.style[aria-pressed=true]{background:var(--glass);box-shadow:0 0 0 2px var(--acc),var(--shadow)}
.stepper{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:999px;padding:3px;width:max-content}
.stepper button{width:42px;height:42px;border-radius:50%;border:0;background:var(--glass);box-shadow:var(--shadow);font-size:22px;font-weight:500;line-height:1;color:var(--ink)}
.stepper b{font-size:22px;min-width:2.2ch;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.hero{position:relative;display:grid;align-content:start;min-height:clamp(600px,150vw,720px);border:.5px solid var(--rim);border-radius:32px;overflow:hidden;box-shadow:var(--shadow);background:var(--bg);isolation:isolate}
.heroimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 100%;z-index:-2}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,var(--bg) 0%,color-mix(in srgb,var(--bg) 92%,transparent) 26%,color-mix(in srgb,var(--bg) 55%,transparent) 42%,transparent 60%)}
.herotext{padding:28px 24px 0}
.hero .btn.ghost{background:var(--glass);border:.5px solid var(--rim);box-shadow:var(--shadow)}
@media(min-width:720px){.hero{min-height:620px}.heroimg{object-position:50% 78%}.herotext{padding:40px 40px 0;max-width:640px}.hero::before{background:linear-gradient(180deg,var(--bg) 0%,color-mix(in srgb,var(--bg) 90%,transparent) 30%,color-mix(in srgb,var(--bg) 45%,transparent) 48%,transparent 66%)}}
.hero p{color:color-mix(in srgb,var(--ink) 72%,transparent);margin:10px 0 20px;max-width:46ch}
.feature{margin-top:14px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr) auto;align-items:center;border-radius:28px;padding:20px 22px;text-decoration:none;color:inherit;border:.5px solid var(--rim);box-shadow:var(--shadow);background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 26%,transparent),var(--glass2))}
.feature small{font-weight:700;color:var(--acc);font-size:13px}
.feature h3{font-size:22px;margin:2px 0 4px}
.feature svg{width:80px;height:80px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.sec{margin-top:30px}
.sechead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:12px;padding:0 2px}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tool{display:grid;gap:8px;align-content:start;background:var(--glass);border:.5px solid var(--rim);border-radius:24px;padding:16px;text-decoration:none;color:inherit;min-height:132px;box-shadow:var(--shadow);transition:transform .15s}

.tool svg{width:40px;height:40px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.15))}
.tool b{font-size:16px;line-height:1.25;font-weight:650}
.tool span{font-size:13px;color:var(--soft)}
.tool.soon{background:transparent;box-shadow:none;border:1px dashed var(--fill2);-webkit-backdrop-filter:none;backdrop-filter:none}
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.proj{display:grid;grid-template-columns:60px minmax(0,1fr);gap:12px;align-items:center;background:var(--glass);border:.5px solid var(--rim);border-radius:24px;padding:12px;text-align:left;width:100%;box-shadow:var(--shadow);color:var(--ink)}
.proj .th{width:60px;height:60px;border-radius:16px;background:var(--fill) center/cover;display:grid;place-items:center;overflow:hidden}
.proj .th svg{width:46px;height:46px}
.proj b{display:block;font-size:16px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj .pt{display:block;color:var(--ink)}.proj .pt>span{display:block;font-size:13px;color:var(--soft)}
.prog{display:block;height:6px;border-radius:9px;background:var(--fill2);margin-top:7px;overflow:hidden}.prog i{display:block;height:100%;background:var(--acc);border-radius:9px}
.empty{border:1px dashed var(--fill2);border-radius:24px;padding:24px;text-align:center;color:var(--soft);background:light-dark(rgba(255,255,255,.25),rgba(255,255,255,.03))}
.empty p{margin-bottom:14px}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,6,3,.28);display:grid;place-items:end center;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet[hidden]{display:none}
.sheet>div{width:min(640px,100%);max-height:94vh;overflow:auto;background:light-dark(rgba(250,247,243,.82),rgba(34,29,26,.82));border:.5px solid var(--rim);border-radius:30px 30px 0 0;padding:26px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px -10px rgba(0,0,0,.3);position:relative}
.sheet>div::before{content:"";position:absolute;top:8px;left:50%;width:38px;height:5px;margin-left:-19px;border-radius:5px;background:var(--fill2)}
@media(min-width:700px){.sheet{place-items:center}.sheet>div{border-radius:30px}.sheet>div::before{display:none}}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%);background:light-dark(rgba(30,22,16,.78),rgba(250,246,240,.85));color:light-dark(#fff,#1d1712);padding:12px 20px;border-radius:999px;font-weight:600;font-size:15px;z-index:30;box-shadow:0 10px 30px -8px rgba(0,0,0,.35);max-width:90vw}
.toast[hidden]{display:none}
.dots3{display:flex;gap:6px;margin-bottom:16px}.dots3 i{flex:1;height:4px;border-radius:4px;background:var(--fill2)}.dots3 i.on{background:var(--acc)}
.photo{position:relative;border-radius:20px;overflow:hidden;background:#000}
.photo img{display:block;width:100%;height:auto}
.photo svg{position:absolute;pointer-events:none;filter:drop-shadow(0 6px 12px rgba(0,0,0,.3))}
.fitrow{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:.5px solid var(--hair);font-size:15px}
.fitrow:last-child{border-bottom:0}
.fitrow span:last-child{text-align:right;font-weight:600}
.saved{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.sv{display:grid;grid-template-columns:80px minmax(0,1fr);gap:12px;align-items:center}
.sv .th{width:80px;height:80px;border-radius:18px;background:var(--fill);display:grid;place-items:center}
.sv .th svg{width:66px;height:66px}
.btn.small{min-height:38px;padding:0 14px;font-size:14px}
@media(pointer:coarse){.btn.small{min-height:44px}}
.mini-btn{width:30px;height:30px;border-radius:50%;border:0;background:var(--fill);font-size:17px;line-height:1;color:var(--ink)}

@media(pointer:coarse){.mini-btn{width:36px;height:36px}}
.mini{display:flex;gap:3px;margin-top:6px}.mini i{flex:1;height:10px;border-radius:5px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.loupe{position:absolute;width:58px;height:58px;border-radius:50%;border:4px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.45);transform:translate(-50%,-125%);pointer-events:none;display:none}
.found{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}

.fnd[aria-pressed=true]{background:var(--glass);box-shadow:0 0 0 2px var(--acc)}
.fnd[aria-pressed=true] i::after{content:"✓";display:grid;place-items:center;height:100%;color:#fff;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.cmp{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.cmpi b{display:block;font-size:14px;margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stlist{display:grid;gap:12px;margin-top:14px}

.stc{padding:6px 18px}
.stc[open]{padding-bottom:18px}
.stc summary{gap:14px;min-height:72px;list-style:none}
.stc summary::-webkit-details-marker{display:none}
.stc summary>span:last-child{display:grid;gap:2px}
.sth{width:64px;height:44px;flex:none;color:var(--acc);display:grid;place-items:center;background:var(--fill);border-radius:12px}
.chart{width:100%;height:auto;color:var(--ink)}.chart.sm{width:56px;color:var(--acc)}
.chartfig{color:var(--ink);padding:18px}
.ab{display:inline-block;font-size:13px;font-weight:700;background:var(--accSoft);color:var(--acc);padding:2px 8px;border-radius:8px;margin-left:4px;vertical-align:2px}
.tipbox{margin-top:14px;background:var(--accSoft);border-radius:16px;padding:12px 14px;font-size:15px}.tipbox b{color:var(--acc);margin-right:4px}
.yarnlist{display:grid;gap:12px}
@media(min-width:900px){.yarnlist{grid-template-columns:repeat(2,minmax(0,1fr))}}
.yi{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:start}
.yth{width:72px;height:72px;border-radius:18px;background-size:cover;background-position:center;position:relative;display:block;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.yth i{position:absolute;right:-4px;bottom:-4px;width:24px;height:24px;border-radius:50%;border:2px solid var(--bg)}
.yth.big{width:88px;height:88px;flex:none}
.rcard{margin-top:14px}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.rlab{display:block;font-size:13px;font-weight:600;color:var(--soft);margin:0 0 6px 4px}
.rimg{display:grid;place-items:center;aspect-ratio:3/4;border-radius:18px;overflow:hidden;background:var(--fill);border:.5px solid var(--rim);width:100%;padding:0}
.rimg svg{width:100%;height:100%}
.rimg img{width:100%;height:100%;object-fit:cover;display:block}
.rbtn{cursor:zoom-in}
.shimmer{background:linear-gradient(110deg,var(--fill) 30%,color-mix(in srgb,var(--acc) 18%,var(--fill)) 50%,var(--fill) 70%);background-size:220% 100%;text-align:center;color:var(--soft);font-weight:600;font-size:14px}

.demo-note{margin-top:12px;font-size:14px;background:var(--accSoft);border-radius:14px;padding:10px 12px}
.rgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}
.rthumb{border:0;padding:0;border-radius:14px;overflow:hidden;aspect-ratio:3/4;background:var(--fill)}.rthumb img{width:100%;height:100%;object-fit:cover;display:block}
@media(max-width:600px){table{font-size:14px}.card{padding:18px 16px}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--glass:light-dark(rgba(255,253,249,.96),rgba(40,34,30,.96))}}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
{
/* ================= basics ================= */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const r1=x=>Math.round(x*10)/10, f=x=>Math.round(x*10)/10;
const okHex=h=>/^#[0-9a-f]{6}$/i.test(h);
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};

const NAMES=[['Oat','#e8dcc4'],['Cream','#f3ead8'],['Ivory','#fbf6ea'],['Charcoal','#3b3836'],['Black','#1d1c1b'],['Grey','#9a9792'],['Silver','#c9c7c2'],['Terracotta','#c4664a'],['Rust','#a9472c'],['Blush','#e9b8ad'],['Dusty rose','#c98f8a'],['Coral','#ec7c62'],['Red','#b8282c'],['Wine','#6e2233'],['Mustard','#d6a23c'],['Sunshine','#f2cf55'],['Butter','#f3e19a'],['Sage','#9cae8c'],['Olive','#78773f'],['Forest','#2f5a3f'],['Mint','#bfe0cc'],['Teal','#2b7b7a'],['Sky','#9cc7e2'],['Denim','#4c6a8c'],['Navy','#23314f'],['Lilac','#b9a6d2'],['Lavender','#9a86c0'],['Plum','#6c3d63'],['Caramel','#b07a45'],['Chocolate','#5a3a29'],['Sand','#d8c09a'],['Peach','#f3c3a0'],['Orange','#e2812f'],['Pink','#e58fb0'],['Fuchsia','#c2397a'],['White','#ffffff']];
const hex2=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const nameOf=h=>{if(!okHex(h))return'Colour';const c=hex2(h);let b='',bd=1e9;for(const[n,x]of NAMES){const d=hex2(x),e=(c[0]-d[0])**2*.3+(c[1]-d[1])**2*.59+(c[2]-d[2])**2*.11;if(e<bd){bd=e;b=n}}return b};
const mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t), rgb=x=>`rgb(${x.map(Math.round).join(',')})`;
const tone=h=>{const c=hex2(okHex(h)?h:'#999999');return{base:h,light:rgb(mix(c,[255,255,255],.4)),dark:rgb(mix(c,[30,16,8],.42)),deep:rgb(mix(c,[22,12,6],.6))}};

/* ================= crochet data ================= */
const WEIGHTS=[{id:1,name:'Super fine (fingering, 4 ply)',hook:3,sc:26,g:100,m:400},{id:2,name:'Fine (sport)',hook:4,sc:19,g:100,m:300},{id:3,name:'Light (DK, 8 ply)',hook:4.5,sc:16,g:100,m:230},{id:4,name:'Medium (worsted, aran)',hook:5.5,sc:13,g:100,m:180},{id:5,name:'Bulky (chunky)',hook:7,sc:9.5,g:100,m:110},{id:6,name:'Super bulky',hook:10,sc:7,g:100,m:65}];
const WT=id=>WEIGHTS.find(w=>w.id===+id)||WEIGHTS[3];
const ST={sc:{w:1,h:1,y:8.2,turn:1,mult:1},hdc:{w:.93,h:.72,y:10.5,turn:2,mult:1},dc:{w:.9,h:.5,y:13,turn:3,mult:1},tr:{w:.88,h:.38,y:16,turn:4,mult:1},moss:{w:1,h:1.05,y:7.5,turn:2,mult:2},granny:{w:.9,h:.5,y:12,turn:3,mult:3}};
const STN={US:{sc:'Single crochet (sc)',hdc:'Half double crochet (hdc)',dc:'Double crochet (dc)',tr:'Treble crochet (tr)',moss:'Moss stitch',granny:'Granny stitch rows'},UK:{sc:'Double crochet (dc)',hdc:'Half treble (htr)',dc:'Treble (tr)',tr:'Double treble (dtr)',moss:'Moss stitch',granny:'Granny stitch rows'}};
const TERMS={US:{sc:'sc',hdc:'hdc',dc:'dc',tr:'tr'},UK:{sc:'dc',hdc:'htr',dc:'tr',tr:'dtr'}};
const tx=s=>String(s).replace(/\{(sc|hdc|dc|tr|slst)\}/g,(m,k)=>k==='slst'?'sl st':TERMS[DB.settings.terms][k]).replace(/(^|[.:]\s+)(sl st|ch \d)/g,(m,a,b)=>a+b[0].toUpperCase()+b.slice(1));
const abbr=k=>TERMS[DB.settings.terms][k];
function gauge(o){const W=WT(o.weight),st=ST[o.st]||ST.sc,hook=+o.hook||W.hook,scS=W.sc*Math.pow(W.hook/hook,.8);let sts=scS*st.w,rows=scS*1.15*st.h,own=false;
  if(o.own&&+o.sts>0&&+o.rows>0){const k=DB.settings.units==='in'?10/10.16:1;sts=+o.sts*k;rows=+o.rows*k;own=true}
  return{sts,rows,stW:10/sts,rowH:10/rows,scW:10/scS,scH:10/(scS*1.15),own}}
function rect(w,h,G,key){const st=ST[key]||ST.sc,m=st.mult,sts=Math.max(m,Math.round(w/G.stW/m)*m),rows=Math.max(1,Math.round(h/G.rowH));return{sts,rows,chain:sts+st.turn,fw:sts*G.stW,fh:rows*G.rowH,m:sts*rows*st.y*G.stW/100}}

/* ---- granny square patterns ---- */
const STYLES=[['classic','Classic'],['solid','Solid'],['daisy','Daisy'],['sunburst','Sunburst'],['tulip','Tulip'],['floral','Floral']];
const SNAME=k=>(STYLES.find(s=>s[0]===k)||['','Granny'])[1];
const MINR={classic:2,solid:2,daisy:3,sunburst:4,tulip:3,floral:5},MAXR=14;
const HU={sc:1,hdc:1.39,dc:2,tr:2.63};
const YPS={ch:2.2,slst:2.5,sc:7.5,hdc:9.5,dc:11.5,tr:14,puff:18,bob:24};
const ROLEI={centre:0,petal:1,body:2,border:3};
const ROLEN={centre:'Centre',petal:'Petals',body:'Body',border:'Border'};
function gen(style,n,S){
  const R=[],tcN={hdc:2,dc:3,tr:4}[S],tc=`ch ${tcN}`;
  const cont=(c)=>({role:'body',where:'a corner ch-2 space',h:HU[S],geo:{t:'sq',p:c+2},
    text:c===0?`${tc} (counts as the first {${S}}), (2 {${S}}, ch 2, 3 {${S}}) in the same space, ch 1, *(3 {${S}}, ch 2, 3 {${S}}) in the next corner space, ch 1; repeat from * twice more. {slst} to the top of the beginning chain.`
      :`${tc} (counts as the first {${S}}), (2 {${S}}, ch 2, 3 {${S}}) in the same space, *[ch 1, 3 {${S}} in the next ch-1 space] ${c} ${c===1?'time':'times'}, ch 1, (3 {${S}}, ch 2, 3 {${S}}) in the next corner space; repeat from * twice more, [ch 1, 3 {${S}} in the next ch-1 space] ${c} ${c===1?'time':'times'}, ch 1. {slst} to the top of the beginning chain.`,
    total:`${24+12*c} {${S}} in ${8+4*c} clusters`,cnt:{[S]:24+12*c,ch:8+4*(c+1)+tcN,slst:1}});
  const r1sq={role:'centre',h:HU[S]+.3,geo:{t:'sq',p:1},text:`Make a magic ring (or ch 4 and {slst} to the first ch to form a ring). ${tc} (counts as the first {${S}}), 2 {${S}} into the ring, ch 2, [3 {${S}}, ch 2] 3 times. {slst} to the top of the beginning chain.`,total:`12 {${S}}, 4 corner spaces`,cnt:{[S]:12,ch:8+tcN,slst:1}};
  const ring8={role:'centre',h:1.3,geo:{t:'circ',n:8,st:'sc'},text:'Make a magic ring. Ch 1, 8 {sc} into the ring. {slst} to the first {sc}.',total:'8 {sc}',cnt:{sc:8,ch:1,slst:1}};
  const ring16={role:'centre',h:2.3,geo:{t:'circ',n:16,st:'dc'},text:'Make a magic ring. Ch 3 (counts as {dc}), 15 {dc} into the ring. {slst} to the top of the ch-3.',total:'16 {dc}',cnt:{dc:16,ch:3,slst:1}};
  if(style==='classic'){R.push(r1sq);for(let k=2;k<=n;k++)R.push(cont(k-2))}
  else if(style==='solid'){R.push(r1sq);for(let k=2;k<=n;k++){const a=4*k-5;R.push({role:'body',where:'a corner ch-2 space',h:HU[S],geo:{t:'solid'},text:`${tc} (counts as the first {${S}}), (1 {${S}}, ch 2, 2 {${S}}) in the same space, *{${S}} in each of the next ${a} stitches, (2 {${S}}, ch 2, 2 {${S}}) in the next corner space; repeat from * twice more, {${S}} in each of the next ${a} stitches. {slst} to the top of the beginning chain.`,total:`${16*k-4} {${S}}`,cnt:{[S]:16*k-4,ch:8+tcN,slst:1}})}}
  else if(style==='daisy'){R.push(ring8,
    {role:'petal',where:'any {sc}',h:1.8,geo:{t:'puff',n:8},text:'Ch 2, puff stitch in the same stitch, ch 3, *puff stitch in the next {sc}, ch 3; repeat from * 6 more times. {slst} to the top of the first puff.',total:'8 puffs, 8 ch-3 spaces',cnt:{puff:8,ch:26,slst:1}},
    {role:'body',where:'any ch-3 space',h:2,geo:{t:'sq',p:3},text:'Ch 3 (counts as {dc}), (2 {dc}, ch 2, 3 {dc}) in the same space for the first corner, 3 {hdc} in the next ch-3 space, *(3 {dc}, ch 2, 3 {dc}) in the next space, 3 {hdc} in the next space; repeat from * twice more. {slst} to the top of the ch-3.',total:'24 {dc} and 12 {hdc}',cnt:{dc:24,hdc:12,ch:11,slst:1}});
    for(let k=4;k<=n;k++)R.push(cont(k-2))}
  else if(style==='sunburst'){R.push(ring16,
    {role:'petal',where:'any space between two {dc}',h:2,geo:{t:'pair',n:16},text:'Ch 2, {dc} in the same space (counts as the first cluster), ch 2, *2-{dc} cluster in the next space between stitches, ch 2; repeat from * 14 more times. {slst} to the top of the first cluster.',total:'16 clusters, 16 ch-2 spaces',cnt:{dc:32,ch:34,slst:1}},
    {role:'petal',where:'any ch-2 space',h:2,geo:{t:'fan',n:16},text:'Ch 3 (counts as {dc}), 2 {dc} in the same space, *3 {dc} in the next ch-2 space; repeat from * 14 more times. {slst} to the top of the ch-3.',total:'48 {dc} in 16 groups',cnt:{dc:48,ch:3,slst:1}},
    {role:'body',where:'any space between two 3-{dc} groups',h:2,geo:{t:'sq',p:5},text:'Ch 3 (counts as {dc}), (2 {dc}, ch 2, 3 {dc}) in the same space for the first corner, *3 {hdc} in the next space, 3 {sc} in the next space, 3 {hdc} in the next space, (3 {dc}, ch 2, 3 {dc}) in the next space; repeat from * twice more, then 3 {hdc}, 3 {sc} and 3 {hdc} in the next three spaces. {slst} to the top of the ch-3.',total:'24 {dc}, 24 {hdc} and 12 {sc}',cnt:{dc:24,hdc:24,sc:12,ch:11,slst:1}});
    for(let k=5;k<=n;k++)R.push(cont(k-1))}
  else if(style==='tulip'){R.push(ring8,
    {role:'petal',where:'any {sc}',h:2.2,geo:{t:'tulip'},text:'Ch 2, {dc}2tog in the same stitch (counts as the first bobble), ch 3, bobble in the same {sc}, ch 3, skip the next {sc}, *(bobble, ch 3, bobble) in the next {sc}, ch 3, skip the next {sc}; repeat from * twice more. {slst} to the top of the first bobble.',total:'4 tulips (8 bobbles), 8 ch-3 spaces',cnt:{bob:8,ch:26,slst:1}},
    {role:'body',where:'the ch-3 space at the tip of any tulip',h:2,geo:{t:'sq',p:3},text:'Ch 3 (counts as {dc}), (2 {dc}, ch 2, 3 {dc}) in the same space for the first corner, 5 {hdc} in the next ch-3 space, *(3 {dc}, ch 2, 3 {dc}) in the next tulip tip, 5 {hdc} in the next space; repeat from * twice more. {slst} to the top of the ch-3.',total:'24 {dc} and 20 {hdc}',cnt:{dc:24,hdc:20,ch:11,slst:1}});
    for(let k=4;k<=n;k++)R.push(cont(k-2))}
  else{R.push(ring16,
    {role:'petal',where:'any {dc}',h:1.2,geo:{t:'loops',n:8},text:'Ch 1, {sc} in the same stitch, *ch 3, skip the next {dc}, {sc} in the next {dc}; repeat from * 6 more times, ch 3, skip the last {dc}. {slst} to the first {sc}.',total:'8 {sc}, 8 ch-3 loops',cnt:{sc:8,ch:25,slst:1}},
    {role:'petal',where:'any ch-3 loop',h:1.9,geo:{t:'petal',n:8},text:'Ch 1, then in each ch-3 loop work ({sc}, {hdc}, 2 {dc}, {hdc}, {sc}). {slst} to the first {sc}.',total:'8 petals',cnt:{sc:16,hdc:16,dc:16,ch:1,slst:1}},
    {role:'body',where:'the back of the work, around the post of any Round 2 {sc}',h:.6,geo:{t:'loops',n:8,hidden:1},text:'Working behind the petals: ch 1, {sc} around the post of the same {sc}, *ch 4, {sc} around the post of the next Round 2 {sc}; repeat from * 6 more times, ch 4. {slst} to the first {sc}.',total:'8 ch-4 loops behind the petals',cnt:{sc:8,ch:33,slst:1}},
    {role:'body',where:'any ch-4 loop',h:2,geo:{t:'sq',p:3},text:'Ch 3 (counts as {dc}), (2 {dc}, ch 2, 3 {dc}) in the same loop for the first corner, 4 {hdc} in the next loop, *(3 {dc}, ch 2, 3 {dc}) in the next loop, 4 {hdc} in the next loop; repeat from * twice more. {slst} to the top of the ch-3.',total:'24 {dc} and 16 {hdc}',cnt:{dc:24,hdc:16,ch:11,slst:1}});
    for(let k=6;k<=n;k++)R.push(cont(k-3))}
  const out=R.slice(0,n).map(r=>({...r}));if(out.length>1)out[out.length-1].role='border';return out;
}
const rc=(gd,i,role)=>{const o=gd.ov[i];return o!=null&&o<gd.pal.length?o:Math.min(ROLEI[role],gd.pal.length-1)};
function sqStats(gd){
  const rs=gen(gd.style,gd.n,gd.S),G=gauge({weight:gd.weight,hook:gd.hook,st:'sc'});let units=0,prev=-1;const per=gd.pal.map(()=>0);
  rs.forEach((r,i)=>{units+=r.h;const ci=rc(gd,i,r.role);let cm=0;for(const k in r.cnt)cm+=r.cnt[k]*(YPS[k]||8)*G.scW;per[ci]+=cm/100+(ci!==prev?.3:0);prev=ci});
  return{rs,G,side:units*2*G.scH,per,total:per.reduce((a,b)=>a+b,0)};
}
function bestRounds(gd,target){let best=MINR[gd.style],bd=1e9;for(let n=MINR[gd.style];n<=MAXR;n++){const s=sqStats({...gd,n}).side,d=Math.abs(s-target);if(d<bd){bd=d;best=n}}return best}

/* ---- granny square drawing ---- */
function post(x,y,len,w,ang,t){return`<rect x="${f(-w/2)}" y="${f(-len/2)}" width="${f(w)}" height="${f(len)}" rx="${f(w/2)}" transform="translate(${f(x)} ${f(y)}) rotate(${f(ang)})" fill="${t.base}" stroke="${t.dark}" stroke-width="${f(Math.max(.35,w*.13))}"/>`}
function ell(x,y,rx,ry,ang,t){return`<ellipse rx="${f(rx)}" ry="${f(ry)}" transform="translate(${f(x)} ${f(y)}) rotate(${f(ang)})" fill="${t.base}" stroke="${t.dark}" stroke-width="${f(Math.max(.4,rx*.12))}"/>`}
function sqSVG(gd,map){
  const rs=gen(gd.style,gd.n,gd.S),cols=rs.map((r,i)=>gd.pal[map?map(rc(gd,i,r.role)):rc(gd,i,r.role)]||'#999999'),T=cols.map(tone);const GP=cols.map(h=>rgb(mix(hex2(okHex(h)?h:'#999999'),[40,24,12],.32)));
  let e=0;const ext=rs.map(r=>e+=r.h),k=112/e;let o='';
  for(let i=rs.length-1;i>=0;i--){const s=ext[i]*k,t=rs[i].geo.t;if(rs[i].geo.hidden)continue;o+=(t==='sq'||t==='solid')?`<rect x="${f(-s)}" y="${f(-s)}" width="${f(2*s)}" height="${f(2*s)}" rx="${f(s*.05)}" fill="${GP[i]}"/>`:`<circle r="${f(s)}" fill="${GP[i]}"/>`}
  rs.forEach((r,i)=>{const g=r.geo,t=T[i];if(g.hidden)return;const a=i?ext[i-1]*k:0,b=ext[i]*k,mid=(a+b)/2,band=b-a,P=Math.PI;
    if(g.t==='sq'){const seg=2*mid/g.p,cw=Math.min(band*.34,seg/3.4),len=band*.86;for(let q=0;q<4;q++){o+=`<g transform="rotate(${q*90})">`;for(let j=0;j<g.p;j++){const u=-mid+(j+.5)*seg;for(let m=-1;m<=1;m++)o+=post(u+m*cw,mid,len,cw*.86,0,t)}o+=`<circle cx="${f(mid)}" cy="${f(mid)}" r="${f(band*.16)}" fill="${t.base}" stroke="${t.dark}" stroke-width=".5"/></g>`}}

function patternHTML(gd,withHead=true){
  const st=sqStats(gd),W=WT(gd.weight);const name=i=>nameOf(gd.pal[i]);let prev=-1;
  const rows=st.rs.map((r,i)=>{const ci=rc(gd,i,r.role);let start='';if(i>0)start=ci===prev?`Continue in ${name(ci)}: {slst} across to ${r.where}. `:`Fasten off ${name(prev)}. Join ${name(ci)} in ${r.where}. `;prev=ci;
    return`<div class="rnd"><h4><span class="sw" style="background:${esc(gd.pal[ci])}"></span>Round ${i+1} · ${esc(name(ci))}</h4><p>${esc(tx(start+r.text))}</p><p class="cnt">${esc(tx(r.total))}</p></div>`}).join('');
  const used=[...new Set(st.rs.map((r,i)=>rc(gd,i,r.role)))];
  return`${withHead?`<p class="note" style="margin-bottom:12px">${SNAME(gd.style)} granny square, ${gd.n} rounds, ${DB.settings.terms} terms. With ${W.name.split(' (')[0].toLowerCase()} yarn and a ${gd.hook} mm hook it should measure about ${L(st.side)} square. Your tension may differ, so measure your first square.</p>`:''}
   <div class="lab">Abbreviations</div><p class="note">ch = chain · sl st = slip stitch · ${abbr('sc')} = ${STN[DB.settings.terms].sc.split(' (')[0].toLowerCase()} · ${abbr('hdc')} = ${STN[DB.settings.terms].hdc.split(' (')[0].toLowerCase()} · ${abbr('dc')} = ${STN[DB.settings.terms].dc.split(' (')[0].toLowerCase()} · ${abbr('tr')} = ${STN[DB.settings.terms].tr.split(' (')[0].toLowerCase()} · sp = space${gd.style==='daisy'?' · puff stitch = (yarn over, insert hook, pull up a loop) 3 times in the same stitch, yarn over and pull through all 7 loops':''}${gd.style==='tulip'?` · bobble = ${abbr('dc')}3tog worked in the same stitch`:''}${gd.style==='sunburst'?` · 2-${abbr('dc')} cluster = ${abbr('dc')}2tog worked in the same space`:''}</p>
   <div class="lab">Yarn for one square</div><p class="note">${used.map(i=>`${esc(name(i))} about ${M(st.per[i])}`).join(' · ')}</p>
   <div class="lab">Rounds</div><div class="rounds">${rows}</div>
   <div class="lab">Finishing</div><p>Fasten off and weave in all ends. Pin the square to ${L(st.side)} × ${L(st.side)}, mist with water and leave it to dry.</p>`;
}
R.granny={build(){const g=DB.granny;g.n=Math.max(MINR[g.style],Math.min(MAXR,g.n));
  return`<div class="head"><h1>Granny square designer</h1><p>Pick a style, set the rounds and colour each one. The pattern below updates as you go.</p></div>
  <div class="cols"><div class="sticky"><div class="card"><div class="fig sqfig" id="gFig"></div><div class="stats" style="margin-top:14px" id="gStats"></div>
    <div class="row" style="margin-top:14px"><button class="btn" data-act="savedesign" data-kind="granny">Save design</button><a class="btn ghost" href="#bag">Use in a bag</a></div></div><div id="gRender"></div></div>
  <div class="stack"><div class="card"><div class="lab">Style</div><div class="styles">${STYLES.map(([k,l])=>`<button class="style" data-set="granny.style" data-v="${k}" aria-pressed="${g.style===k}">${sqThumb({...g,style:k,n:MINR[k]+1,ov:{}})}${l}</button>`).join('')}</div>
    <div class="grid2" style="margin-top:16px;align-items:start"><div><div class="lab">Rounds</div><div class="stepper"><button data-act="gn" data-d="-1" aria-label="Fewer rounds">−</button><b>${g.n}</b><button data-act="gn" data-d="1" aria-label="More rounds">+</button></div></div>
    <div><div class="lab">Main stitch</div>${chips('granny.S',[['hdc',abbr('hdc')],['dc',abbr('dc')],['tr',abbr('tr')]])}</div></div>
    <p class="note" style="margin-top:8px">${g.style==='classic'||g.style==='solid'?'The main stitch is used in every round.':'The flower centre keeps its own stitches; the main stitch is used for the rounds that grow the square.'}</p></div>
  <div class="card"><div class="lab">Colours</div><div class="palette" id="gPal"></div><div class="row" style="margin-top:12px"><button class="btn ghost" data-act="paladd" ${g.pal.length>=6?'disabled':''}>Add colour</button><button class="btn ghost" data-act="palrem" ${g.pal.length<=2?'disabled':''}>Remove last colour</button><button class="btn ghost" data-act="palreset">Reset round colours</button></div>
    <div class="lab">Colour of each round</div><div class="rounds" id="gRounds"></div></div>

/* ================= COLOUR TOOLS ================= */
function toLab(h){let [r,g,b]=hex2(h).map(v=>{v/=255;return v>.04045?((v+.055)/1.055)**2.4:v/12.92});let x=(r*.4124+g*.3576+b*.1805)/.95047,y=r*.2126+g*.7152+b*.0722,z=(r*.0193+g*.1192+b*.9505)/1.08883;const fn=t=>t>.008856?Math.cbrt(t):7.787*t+16/116;x=fn(x);y=fn(y);z=fn(z);return[116*y-16,500*(x-y),200*(y-z)]}

const toHexA=a=>'#'+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
function loadImg(src){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=src})}
/* find the main colours in a photo: k-means on a small copy, then merge near-duplicates */
async function extractColours(src,k=7,crop=1){
  const im=await loadImg(src),c=document.createElement('canvas'),s=90/Math.max(im.width,im.height);c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));
  const x=c.getContext('2d');const cw=im.width*crop,ch=im.height*crop;x.drawImage(im,(im.width-cw)/2,(im.height-ch)/2,cw,ch,0,0,c.width,c.height);
  const d=x.getImageData(0,0,c.width,c.height).data,px=[],edge=[],W=c.width,H=c.height,m=Math.max(2,Math.round(Math.min(W,H)*.08));for(let i=0;i<d.length;i+=4)if(d[i+3]>128){const p=i/4,xx=p%W,yy=Math.floor(p/W);px.push([d[i],d[i+1],d[i+2]]);edge.push(xx<m||yy<m||xx>=W-m||yy>=H-m)}
  if(!px.length)return[];
  const lum=p=>p[0]*.3+p[1]*.59+p[2]*.11;const sorted=[...px].sort((a,b)=>lum(a)-lum(b));
  let cen=[...Array(k)].map((_,i)=>[...sorted[Math.floor((i+.5)/k*sorted.length)]]),as=new Array(px.length).fill(0);
  for(let it=0;it<12;it++){const sum=cen.map(()=>[0,0,0,0]);px.forEach((p,i)=>{let b=0,bd=1e9;cen.forEach((q,j)=>{const e=(p[0]-q[0])**2+(p[1]-q[1])**2+(p[2]-q[2])**2;if(e<bd){bd=e;b=j}});as[i]=b;const S=sum[b];S[0]+=p[0];S[1]+=p[1];S[2]+=p[2];S[3]++});cen=cen.map((q,j)=>sum[j][3]?[sum[j][0]/sum[j][3],sum[j][1]/sum[j][3],sum[j][2]/sum[j][3]]:q)}
  const cnt=cen.map(()=>0),ec=cen.map(()=>0);as.forEach((a,i)=>{cnt[a]++;if(edge[i])ec[a]++});const et=edge.filter(Boolean).length||1;
  let out=cen.map((q,j)=>({hex:toHexA(q),n:cnt[j],e:ec[j]})).filter(o=>o.n>0).sort((a,b)=>b.n-a.n);
  const merged=[];for(const o of out){const mm=merged.find(p=>dE(p.hex,o.hex)<14);if(mm){mm.n+=o.n;mm.e+=o.e}else merged.push({...o})}
  const tot=px.length;return merged.filter(o=>o.n/tot>.025).map(o=>({hex:o.hex,share:Math.round(o.n/tot*100),bg:o.e/et>.4&&o.e/Math.max(1,o.n)>.3}));
}
function harmony(pal){
  if(pal.length<2)return['Add at least two colours to see how they work together.'];
  const L=pal.map(h=>toLab(h)[0]),out=[],nm=nameOf;
  const hi=pal[L.indexOf(Math.max(...L))],lo=pal[L.indexOf(Math.min(...L))],range=Math.max(...L)-Math.min(...L);
  const close=[];for(let i=0;i<pal.length;i++)for(let j=i+1;j<pal.length;j++)if(dE(pal[i],pal[j])<12)close.push([pal[i],pal[j]]);
  if(range<28)out.push(['warn','These colours are all about as light as each other, so the pattern may look flat from a distance. Add a much lighter or darker colour for contrast.']);
  else out.push(['ok',`Good contrast: ${nm(hi)} is the lightest and ${nm(lo)} the darkest, so the design will show up clearly.`]);
  close.forEach(([a,b])=>out.push(['warn',`${nm(a)} and ${nm(b)} are very close and will look like one colour from a distance.`]));
  const warm=pal.filter(h=>{const[,a,b]=toLab(h);return a+b>25}).length;
  if(warm&&warm<pal.length&&pal.length>2)out.push(['ok','A mix of warm and cool colours: use the warm ones for the centres or focal points and the cool ones around them.']);
  if(pal.length>2&&range>=28)out.push(['ok',`A classic layout: ${nm(hi)} or ${nm(lo)} as the joining and border colour ties everything together.`]);
  return out;
}

 {k:'ch',us:'Chain',uk:'Chain',a:['ch','ch'],lv:0,use:'The starting point of almost everything: foundation rows, turning chains, spaces and loops.',steps:['Make a slip knot and put it on your hook.','Yarn over: wrap the yarn over the hook from back to front.','Pull the yarn through the loop on your hook. That’s one chain.','Repeat for as many chains as the pattern asks.'],tip:'Count the V shapes, not the loop on your hook. Keep chains loose so you can work into them.'},

function paintRender(){const c=$('#rCard');if(!c)return;const k=rState.kind;c.outerHTML=renderCard(k);const s=$('#rSrc');if(s)s.innerHTML=rState.srcSvg||''}
function standaloneSVG(svg,defs=''){let s=svg.replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" ');if(defs)s=s.includes('<defs>')?s.replace('<defs>','<defs>'+defs):s.replace(/(<svg[^>]*>)/,'$1<defs>'+defs+'</defs>');return s.replace(/href="#/g,'href="#').replace(/<use href=/g,'<use xlink:href=')}
async function toPng(svg,max=500){const m=svg.match(/viewBox="([-\d.]+) ([-\d.]+) ([\d.]+) ([\d.]+)"/),vw=m?+m[3]:440,vh=m?+m[4]:440,k=max/Math.max(vw,vh),w=Math.round(vw*k),h=Math.round(vh*k);
  const s=svg.replace('<svg ',`<svg width="${w}" height="${h}" `),url=URL.createObjectURL(new Blob([s],{type:'image/svg+xml'}));
  try{const im=await loadImg(url),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#f4efe7';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);return await new Promise(r=>c.toBlob(r,'image/png'))}finally{URL.revokeObjectURL(url)}}
async function dataToBlob(src,max=500){const im=await loadImg(src),k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.9))}
function renderPrompt(kind,C){const sc=SCENE_TXT[DB.render.scene]||SCENE_TXT.studio;
  if(kind==='granny'){const g=DB.granny,cols=[...new Set(gen(g.style,g.n,g.S).map((r,i)=>nameOf(g.pal[rc(g,i,r.role)])))];
    return`Photorealistic close-up photo of one handmade crochet ${SNAME(g.style).toLowerCase()} granny square made of soft cotton yarn in ${cols.join(', ')}, ${sc}. Copy the exact pattern, number of rounds and colour order shown in image 0. Real yarn texture with visible stitches, natural light, shallow depth of field, high detail.`}
  const b=C.b,gd=C.gd,cols=[...new Set(gd.pal.map(nameOf))].join(', '),hand={short:'two short crocheted handles',shoulder:'a long crocheted shoulder strap',leather:'brown leather handles',none:'no handles'}[b.handle];
  const tote=b.build==='overlay'&&b.photo;
  return(tote?`Photorealistic photo of the canvas tote bag from image 1 with the crochet granny square panel from image 0 sewn onto its front.`:`Photorealistic product photo of a handmade crochet tote bag made of ${SNAME(gd.style).toLowerCase()} granny squares in ${cols}, with ${hand}.`)+` Keep the exact arrangement, colours and number of squares shown in image 0 (${C.faces[0].cols} across and ${C.faces[0].rows} down on the front). The bag is ${sc}. Real cotton yarn texture with visible stitches, natural light, high detail.`}
async function makeReal(kind){
  let png,tote=null,prompt,w,h,srcSvg;
  try{if(kind==='bag'){const C=bagCalc(),svg=bagSVG(C),defs=C.maps.map((m,v)=>`<symbol id="bv${v}" viewBox="-122 -122 244 244">${sqSVG(C.gd,m)}</symbol>`).join('');srcSvg=svg;png=await toPng(standaloneSVG(svg,defs));prompt=renderPrompt('bag',C);w=768;h=1024;if(C.b.build==='overlay'&&C.b.photo)tote=await dataToBlob(C.b.photo)}
    else{const svg=`<svg viewBox="-124 -124 248 248">${sqSVG(DB.granny)}</svg>`;srcSvg=svg;png=await toPng(standaloneSVG(svg));prompt=renderPrompt('granny');w=1024;h=1024}}
  catch(e){rState={kind,status:'error',err:'Couldn’t prepare your design for the photo. Please try again.'};paintRender();return}
  rState={kind,status:'busy',srcSvg};paintRender();
  const fd=new FormData();fd.append('prompt',prompt);fd.append('model',QUAL[DB.render.q][1]);fd.append('width',w);fd.append('height',h);fd.append('input_image_0',png,'design.png');if(tote)fd.append('input_image_1',tote,'tote.jpg');
  try{const r=await fetch('/api/render',{method:'POST',body:fd,headers:DB.settings.rkey?{'X-Hookd-Key':DB.settings.rkey}:{}});
    if(r.status===404||r.status===405)throw{demo:1};const j=await r.json().catch(()=>null);if(!j)throw{demo:1};
    if(!r.ok||!j.image)throw{msg:j.error||`Something went wrong (${r.status}). Please try again.`};
    const mime=j.image.startsWith('/9j')?'image/jpeg':'image/png';rState={kind,status:'done',img:`data:${mime};base64,${j.image}`,srcSvg,prompt};bumpCount()}
  catch(e){if(e&&e.msg)rState={kind,status:'error',err:e.msg,srcSvg};else rState={kind,status:'done',demo:true,img:HERO_IMG,srcSvg}}
  paintRender();
}

   <div class="row" style="margin-top:18px;justify-content:space-between">${w.step>1?'<button class="btn ghost" data-act="wizback">Back</button>':'<span></span>'}${w.step<4?'<button class="btn" data-act="wiznext">Next</button>':'<button class="btn mus" data-act="wizsave">Save project</button>'}</div>`)}
function wizSummary(){const w=DB.wiz,t=w.type,G=gauge({weight:w.weight,hook:w.hook,st:w.st}),Wn=WT(w.weight).name;let html='',measure='';
  if(t==='bag'){const gd={...DB.granny,weight:w.weight,hook:w.hook},s=sqStats(gd).side,c=Math.max(1,Math.round(w.w/s)),r=Math.max(1,Math.round(w.h/s));measure=`Bag ${L(w.w)} wide × ${L(w.h)} high × ${L(w.d)} deep`;
    html=`<p style="margin-top:8px">${esc(measure)}. With your current ${SNAME(gd.style).toLowerCase()} square (about ${L(s)}), the front takes about ${c} × ${r} squares.</p><p class="note" style="margin-top:8px">After saving, the Bag designer opens with these measurements so you can choose the arrangement, handles and lining.</p>`}
  else if(t==='squares'){const gd={...DB.granny,weight:w.weight,hook:w.hook},n=bestRounds(gd,w.sq),st=sqStats({...gd,n});measure=`${w.count} squares of ${L(w.sq)}`;
    html=`<p style="margin-top:8px">${esc(measure)}. Your ${SNAME(gd.style).toLowerCase()} design needs about ${n} rounds for that size (≈ ${L(st.side)}), and about ${M(st.total*w.count*1.1)} of yarn in total.</p><p class="note" style="margin-top:8px">After saving, the Granny square designer opens so you can choose colours.</p>`}
  else{let r,label;if(t==='clothing'){const pw=(+w.chest+ +w.ease)/2;r=rect(pw,+w.len,G,w.st);label=`2 panels, each ${L(pw)} × ${L(w.len)}`;measure=`Chest ${L(w.chest)}, ease ${L(w.ease)}, length ${L(w.len)}`}else{r=rect(+w.w,+w.h,G,w.st);label=`${L(w.w)} × ${L(w.h)}`;measure=label}
    const m=r.m*(t==='clothing'?2:1)*1.1,W=WT(w.weight);
    html=`<p style="margin-top:8px">${esc(label)} in ${STN[DB.settings.terms][w.st].toLowerCase()}.</p><div class="stats" style="margin-top:12px"><div class="stat"><span>Chain</span><b>${r.chain}</b></div><div class="stat"><span>Rows</span><b>${r.rows}</b></div><div class="stat"><span>Yarn (approx.)</span><b>${M(m)}</b></div></div><p class="note" style="margin-top:8px">About ${Math.ceil(m/W.m)} balls of ${W.g} g / ${W.m} m. Estimated from the yarn weight; your own swatch will be more accurate.</p>`}
  return{html,measure:measure,gauge:`${r1(G.sts)} sts × ${r1(G.rows)} rows per 10 cm (estimated)`,yarn:Wn}}

/* ================= events ================= */
function afterSet(path){
  const [k,f2]=path.split('.');
  if(k==='settings'&&(f2==='mode'||f2==='bg'||f2==='custom'))applyTheme();
  if(k==='granny'){const g=DB.granny;if(f2==='style'){g.n=Math.max(MINR[g.style],Math.min(MAXR,g.n));g.ov={}}}
  if(k==='bag'){const b=DB.bag;if(b.build==='overlay'&&b.cover==='all')b.cover='frontback';if(b.build!=='overlay'&&b.cover==='front')b.cover='frontback';if(f2==='handle')b.hlen=b.handle==='shoulder'?100:45}
  if(k==='meas'&&f2==='preset'&&PRESETS[DB.meas.preset]){DB.meas.w=PRESETS[DB.meas.preset][1];DB.meas.h=PRESETS[DB.meas.preset][2]}
  if(k==='meas'&&(f2==='w'||f2==='h'))DB.meas.preset='custom';
  if(k==='wiz'&&f2==='preset'&&PRESETS[DB.wiz.preset]){DB.wiz.w=PRESETS[DB.wiz.preset][1];DB.wiz.h=PRESETS[DB.wiz.preset][2]}
  if(k==='wiz'&&f2==='type'){const d=WIZ_DEF();if(DB.wiz.type==='blanket'){DB.wiz.w=127;DB.wiz.h=152;DB.wiz.preset='throw'}else if(DB.wiz.type==='scarf'){DB.wiz.w=20;DB.wiz.h=180}else if(DB.wiz.type==='bag'){DB.wiz.w=d.w;DB.wiz.h=d.h}else if(DB.wiz.type==='other'){DB.wiz.w=50;DB.wiz.h=50}}
  if((k==='yarn'||k==='wiz'||k==='meas')&&f2==='weight'){const W=WT(DB[k].weight);DB[k].hook=W.hook;if(k==='yarn'){DB.yarn.ballG=W.g;DB.yarn.ballM=W.m}}
  if(k==='granny'&&f2==='weight')DB.granny.hook=WT(DB.granny.weight).hook;
  if(k==='item'&&f2==='weight'){const W=WT(DB.editItem.weight);Object.assign(DB.editItem,{ballG:W.g,ballM:W.m,hook:W.hook})}
}
function refreshSheet(){if(sheetMode==='item')yarnSheet();else if(sheetMode==='wiz')wizSheet();else if(sheetMode==='settings')settingsSheet();else if(sheetMode==='proj')projSheet(curProj)}
document.addEventListener('click',e=>{
  const s=e.target.closest('[data-set]');
  if(s&&!s.disabled){const path=s.dataset.set;let v=s.dataset.v;if(s.dataset.n)v=+v;if(s.dataset.b)v=v==='1';setP(path,v);afterSet(path);save();
    if(path.startsWith('wiz.')||(sheetMode&&path.startsWith('settings.'))){refreshSheet();if(path.startsWith('settings.'))render(true)}else render(true);return}
  const a=e.target.closest('[data-act]');if(!a||a.disabled)return;const act=a.dataset.act,g=DB.granny;
  if(act==='settings')settingsSheet();
  else if(act==='close'){closeSheet();render(true)}
  else if(act==='gn'){g.n=Math.max(MINR[g.style],Math.min(MAXR,g.n+ +a.dataset.d));for(const i in g.ov)if(+i>=g.n)delete g.ov[i];save();render(true)}
  else if(act==='setn'){g.n=+a.dataset.n;save();render(true)}
  else if(act==='rc'){g.ov[a.dataset.i]=+a.dataset.c;save();R.granny.update()}
  else if(act==='paladd'){const used=new Set(g.pal.map(nameOf));g.pal.push((NAMES.find(n=>!used.has(n[0])&&n[0]!=='White')||NAMES[0])[1]);save();render(true)}
  else if(act==='palrem'){g.pal.pop();for(const i in g.ov)if(g.ov[i]>=g.pal.length)delete g.ov[i];save();render(true)}
  else if(act==='palreset'){g.ov={};save();R.granny.update()}
  else if(act==='copypat')copy(plain(`${SNAME(g.style)} granny square\n`+patternHTML(g)));
  else if(act==='visualise'){DB.bag.done=true;save();R.bag.update();const o=$('#bagOut');if(innerWidth<900)o.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})}
  else if(act==='copybag'){const C=bagCalc();copy(`Granny square bag\n\n`+bagSteps(C).map(([t,d],i)=>`${i+1}. ${t}\n${tx(d)}`).join('\n\n')+'\n\n'+plain(patternHTML(C.gd)))}
  else if(act==='bagphotodel'){DB.bag.photo=null;save();render(true)}
  else if(act==='ycadd'){DB.yarn.cols.push({hex:(NAMES.find(n=>!DB.yarn.cols.some(c=>nameOf(c.hex)===n[0]))||NAMES[0])[1],share:20});save();render(true)}
  else if(act==='ycrem'){DB.yarn.cols.splice(+a.dataset.i,1);save();render(true)}
  else if(act==='ycsplit'){const n=DB.yarn.cols.length;DB.yarn.cols.forEach(c=>c.share=r1(100/n));save();render(true)}
  else if(act==='wizard'){DB.wiz=WIZ_DEF();wizSheet()}
  else if(act==='wiznext'){if(DB.wiz.step===2){const w=DB.wiz,t=w.type,need=t==='bag'?[w.w,w.h]:t==='squares'?[w.count,w.sq]:t==='clothing'?[w.chest,w.len]:[w.w,w.h];if(!need.every(x=>+x>0)){toast('Please fill in the measurements first');return}}DB.wiz.step++;wizSheet()}
  else if(act==='wizback'){DB.wiz.step--;wizSheet()}
  else if(act==='wizsave'){const w=DB.wiz,sm=wizSummary(),p={id:uid(),name:w.name.trim()||TNAME(w.type),type:w.type,status:'planning',progress:0,hook:`${w.hook} mm`,gauge:sm.gauge,yarn:sm.yarn,measure:sm.measure,notes:'',photo:w.photo,created:Date.now(),updated:Date.now()};
    DB.projects.push(p);save(true);closeSheet();toast('Project saved');
    if(w.type==='bag'){Object.assign(DB.bag,{w:+w.w,h:+w.h,d:+w.d,cols:0,rows:0,sq:0,done:false});DB.granny.weight=w.weight;DB.granny.hook=w.hook;save();location.hash='bag'}
    else if(w.type==='squares'){DB.granny.weight=w.weight;DB.granny.hook=w.hook;DB.granny.n=bestRounds(DB.granny,+w.sq);DB.granny.target=+w.sq;DB.yarn.count=+w.count;save();location.hash='granny'}
    else{if(location.hash==='#home')render();else location.hash='home'}}
  else if(act==='colphotodel'){DB.colour.photo=null;DB.colour.found=null;save(true);render(true)}
  else if(act==='cadd'){const c=DB.colour;const used=new Set(c.pal.map(nameOf));c.pal.push((NAMES.find(n=>!used.has(n[0]))||NAMES[0])[1]);save();render(true)}
  else if(act==='cshuffle'){const p=DB.colour.pal,b=p.join();let t=0;do{for(let i=p.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]]}}while(p.join()===b&&++t<8);save();R.colour.update()}
  else if(act==='cclear'){DB.colour.pal=[];save();render(true)}
  else if(act==='cleft'){const p=DB.colour.pal,i=+a.dataset.i;[p[i-1],p[i]]=[p[i],p[i-1]];save();R.colour.update()}
  else if(act==='crem'){DB.colour.pal.splice(+a.dataset.i,1);save();render(true)}
  else if(act==='caddpick'){if(colPick&&DB.colour.pal.length<8){DB.colour.pal.push(colPick);save();R.colour.update();toast(`${nameOf(colPick)} added`)}}
  else if(act==='cfound'){const c=DB.colour,h=a.dataset.hex,i=c.pal.findIndex(x=>dE(x,h)<6);if(i>=0)c.pal.splice(i,1);else if(c.pal.length<8)c.pal.push(h);else toast('A palette can have up to 8 colours');save();render(true)}
  else if(act==='cfoundall'){const c=DB.colour;for(const o of c.found||[])if(!o.bg&&c.pal.length<8&&!c.pal.some(x=>dE(x,o.hex)<6))c.pal.push(o.hex);save();render(true)}
  else if(act==='csave'){const name=`Palette ${DB.palettes.length+1}`;DB.palettes.unshift({id:uid(),name:DB.colour.pal.slice(0,3).map(nameOf).join(', ')||name,cols:[...DB.colour.pal]});save(true);R.colour.update();toast('Palette saved')}
  else if(act==='cload'){const p=DB.palettes.find(x=>x.id===a.dataset.id);if(p){DB.colour.pal=[...p.cols];save();render(true)}}
  else if(act==='cdel'){if(a.dataset.confirm){DB.palettes=DB.palettes.filter(x=>x.id!==a.dataset.id);save(true);R.colour.update()}else{a.dataset.confirm='1';a.textContent='Tap again'}}
  else if(act==='ctogranny'){DB.granny.pal=DB.colour.pal.slice(0,6);if(DB.granny.pal.length<2)DB.granny.pal.push('#f3ead8');DB.granny.ov={};save();toast('Palette sent to the granny square designer');location.hash='granny'}
  else if(act==='ctoyarn'){const n=DB.colour.pal.length;DB.yarn.cols=DB.colour.pal.map(h=>({hex:h,share:r1(100/n)}));if(DB.yarn.shape==='granny')DB.yarn.shape='rect';save();toast('Palette sent to the yarn calculator');location.hash='yarn'}
  else if(act==='ynew'){const W=WT(4);DB.editItem={_new:1,id:uid(),hex:'#d6a23c',brand:'',name:'',weight:4,fibre:'Cotton',ballG:W.g,ballM:W.m,balls:1,hook:W.hook,notes:'',photo:null};yarnSheet()}
  else if(act==='yedit'){const y=DB.stash.find(x=>x.id===a.dataset.id);if(y){DB.editItem=clone(y);yarnSheet()}}
  else if(act==='ysave'){const y=DB.editItem;if(!y)return;const isNew=y._new;delete y._new;if(isNew)DB.stash.unshift(y);else{const i=DB.stash.findIndex(x=>x.id===y.id);if(i>=0)DB.stash[i]=y}DB.editItem=null;save(true);closeSheet();render(true);toast(isNew?'Yarn added':'Yarn updated')}
  else if(act==='ydel'){if(a.dataset.confirm){DB.stash=DB.stash.filter(x=>x.id!==a.dataset.id);DB.editItem=null;save(true);closeSheet();render(true);toast('Yarn deleted')}else{a.dataset.confirm='1';a.textContent='Tap again to delete'}}
  else if(act==='yminus'){const y=DB.stash.find(x=>x.id===a.dataset.id);if(y&&+y.balls>0){y.balls=Math.max(0,r1(+y.balls-1));save();render(true)}}
  else if(act==='ypal'){const y=DB.stash.find(x=>x.id===a.dataset.id);if(!y)return;if(DB.colour.pal.some(h=>dE(h,y.hex)<6))toast('That colour is already in your palette');else if(DB.colour.pal.length>=8)toast('Your palette is full (8 colours)');else{DB.colour.pal.push(y.hex);save();toast(`${nameOf(y.hex)} added to Colour studio`)}}
  else if(act==='ytopal'){const c=DB.colour;let n=0;for(const y of DB.stash)if(c.pal.length<8&&!c.pal.some(h=>dE(h,y.hex)<6)){c.pal.push(y.hex);n++}save();toast(n?`${n} colour${n>1?'s':''} added`:'Those colours are already in your palette');location.hash='colour'}
  else if(act==='rmake')makeReal(a.dataset.kind);
  else if(act==='rsave')saveRender();
  else if(act==='rview'){if(rState.img)viewImage(rState.img)}
  else if(act==='rviewsaved'){const r=DB.renders.find(x=>x.id===a.dataset.id);if(r)viewImage(r.img,r.id)}
  else if(act==='rdel'){if(a.dataset.confirm){DB.renders=DB.renders.filter(x=>x.id!==a.dataset.id);save(true);closeSheet();render(true)}else{a.dataset.confirm='1';a.textContent='Tap again to delete'}}
  else if(act==='openproj')projSheet(a.dataset.id);
  else if(act==='projphotodel'){const p=root('proj');if(p){p.photo=null;p.updated=Date.now();save();projSheet(p.id)}}
  else if(act==='delproj'){if(a.dataset.confirm){DB.projects=DB.projects.filter(p=>p.id!==a.dataset.id);DB.saved.forEach(s=>{if(s.projectId===a.dataset.id)s.projectId=null});save(true);closeSheet();render(true);toast('Project deleted')}else{a.dataset.confirm='1';a.textContent='Tap again to delete'}}
  else if(act==='savedesign'){const kind=a.dataset.kind;sheetMode='save';openSheet(`<div class="shead"><h2>Save design</h2><button class="btn ghost" data-act="close">Cancel</button></div>
    <label class="fld"><span>Name</span><div class="inp"><input id="svName" value="${esc(kind==='bag'?`${SNAME(g.style)} bag`:`${SNAME(g.style)} square`)}"></div></label>
    <label class="fld" style="margin-top:12px"><span>Add to project</span><div class="inp"><select id="svProj"><option value="">No project</option>${DB.projects.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}<option value="__new">New project…</option></select></div></label>
    <p class="note" style="margin-top:8px">${kind==='bag'?'The bag photo is not saved with the design.':''}</p>
    <div class="row" style="margin-top:16px"><button class="btn" data-act="dosave" data-kind="${kind}">Save</button></div>`)}
  else if(act==='dosave'){const kind=a.dataset.kind,name=($('#svName').value||'').trim()||'My design';let pid=$('#svProj').value||null;
    if(pid==='__new'){const p={id:uid(),name,type:kind==='bag'?'bag':'squares',status:'planning',progress:0,hook:`${g.hook} mm`,gauge:'',yarn:WT(g.weight).name,measure:kind==='bag'?`Bag ${L(DB.bag.w)} × ${L(DB.bag.h)} × ${L(DB.bag.d)}`:'',notes:'',photo:null,created:Date.now(),updated:Date.now()};DB.projects.push(p);pid=p.id}
    const state=kind==='bag'?{bag:{...clone(DB.bag),photo:null},granny:clone(g)}:clone(g);
    DB.saved.unshift({id:uid(),kind,name,state,projectId:pid,date:Date.now()});const p=DB.projects.find(x=>x.id===pid);if(p)p.updated=Date.now();save(true);closeSheet();toast('Design saved')}
  else if(act==='opensaved'){const s=DB.saved.find(x=>x.id===a.dataset.id);if(!s)return;if(s.kind==='bag'){Object.assign(DB.bag,clone(s.state.bag),{photo:DB.bag.photo,done:true});Object.assign(DB.granny,clone(s.state.granny))}else Object.assign(DB.granny,clone(s.state));save();closeSheet();const h=s.kind==='bag'?'bag':'granny';if(location.hash==='#'+h)render();else location.hash=h}
  else if(act==='delsaved'){if(a.dataset.confirm){DB.saved=DB.saved.filter(s=>s.id!==a.dataset.id);save(true);render(true)}else{a.dataset.confirm='1';a.textContent='Tap again'}}
});
document.addEventListener('input',e=>{const el=e.target.closest('[data-k]');if(!el)return;const path=el.dataset.k,t=el.dataset.t;let v=el.value;
  if(t==='len')v=v===''?0:fromD(+v);else if(t==='num')v=v===''?0:+v;else if(t==='hex'){if(!okHex(v))return}
  setP(path,v);afterSet(path);
  if(path.startsWith('proj.')){const p=root('proj');if(p)p.updated=Date.now();if(path==='proj.progress'){$('#pProg').textContent=v+'%';if(v>=100&&p.status!=='done'){p.status='done'}else if(v>0&&p.status==='planning')p.status='progress'}save();return}
  save();
  if(path.startsWith('wiz.'))return;
  if(path.startsWith('item.')){if(path==='item.hex'){const t=$('#itemCol');if(t)t.textContent=nameOf(v)}return}
  if(path==='stl.q'||path==='stf.q'){render(true);const e2=$(`[data-k="${path}"]`);if(e2){e2.focus();const n=e2.value.length;try{e2.setSelectionRange(n,n)}catch(x){}}return}
  if(path.startsWith('bag.p')&&$('#bagOverlay')){const b=DB.bag,s=$('#bagOverlay');s.style.left=b.px+'%';s.style.top=b.py+'%';s.style.width=b.ps+'%';s.style.opacity=b.po/100;return}
  if(el.tagName==='SELECT'||path==='granny.weight'){render(true);return}
  R[view].update&&R[view].update(path);
});
document.addEventListener('change',e=>{
  const id=e.target.id,file=e.target.files&&e.target.files[0];if(!file)return;
  if(id==='bagPhoto')readImage(file,1000,u=>{DB.bag.photo=u;save(true);render(true)});
  if(id==='projPhoto')readImage(file,700,u=>{const p=root('proj');if(p){p.photo=u;p.updated=Date.now();save(true);projSheet(p.id)}});
  if(id==='colPhoto')readImage(file,1000,u=>{DB.colour.photo=u;DB.colour.found=null;save(true);render(true)});
  if(id==='itemPhoto')readImage(file,500,u=>{const y=DB.editItem;if(!y)return;y.photo=u;extractColours(u,5,.7).then(c=>{const f=c.find(o=>!o.bg)||c[0];if(f)y.hex=f.hex;yarnSheet()}).catch(()=>yarnSheet())});
  if(id==='wizPhoto')readImage(file,700,u=>{DB.wiz.photo=u;wizSheet()});
  if(e.target.tagName==='SELECT'&&e.target.closest('#sheet')&&e.target.dataset.k&&!e.target.dataset.k.startsWith('proj.'))refreshSheet();
});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet'){closeSheet();render(true)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden){closeSheet();render(true)}});
addEventListener('hashchange',()=>render());
if('serviceWorker' in navigator&&location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
applyTheme();render();
}
