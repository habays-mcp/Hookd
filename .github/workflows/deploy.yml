# Deploys hookd to Cloudflare every time something is pushed to main.
# Needs two repository secrets (GitHub → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   – a token made with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  – shown on the Cloudflare Workers & Pages overview page
name: Deploy to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
